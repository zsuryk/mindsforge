[project]
name = "mindsforge-backend"
version = "0.1.0"
description = "AI-driven creator platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.51",
    "alembic==1.19.1",
    "groq==1.6.0",
    "yt-dlp[default,curl-cffi]==2026.7.4",
    "python-multipart>=0.0.32",
    "httpx==0.28.1",
    "pillow==12.3.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest==9.1.1",
]

[tool.uv]
package = false
